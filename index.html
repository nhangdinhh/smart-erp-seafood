<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart ERP Seafood - Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1120;
            --surface-color: rgba(30, 41, 59, 0.7);
            --surface-border: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(51, 65, 85, 0.8);
            --input-focus: #3b82f6;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Ambient animated background */
        .ambient-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: #0b1120;
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 10s infinite alternate ease-in-out;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #3b82f6, transparent 70%);
            animation-delay: 0s;
        }

        .blob-2 {
            bottom: -20%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #8b5cf6, transparent 70%);
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        .auth-wrapper {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            perspective: 1000px;
            z-index: 1;
        }

        .auth-card {
            background: var(--surface-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
        }

        .auth-header {
            text-align: center;
            padding: 40px 40px 20px 40px;
        }

        .auth-header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 15px;
        }

        .tabs {
            display: flex;
            margin: 0 40px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 4px;
            position: relative;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .tab-btn.active {
            color: #fff;
        }

        .tab-slider {
            position: absolute;
            top: 4px;
            left: 4px;
            width: calc(50% - 4px);
            height: calc(100% - 8px);
            background: var(--surface-border);
            border-radius: 8px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .form-container {
            padding: 30px 40px 40px 40px;
            position: relative;
            min-height: 380px; /* To prevent height jumping */
        }

        .form-section {
            position: absolute;
            top: 30px;
            left: 40px;
            right: 40px;
            opacity: 0;
            visibility: hidden;
            transform: translateX(20px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-section.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
            position: relative;
            top: 0;
            left: 0;
            right: 0;
        }

        .form-section.slide-left {
            transform: translateX(-20px);
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            transition: color 0.3s;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            background: rgba(15, 23, 42, 0.8);
        }

        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            color: #fff;
        }

        /* Two column grid for register form */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .checkbox-wrapper input[type="checkbox"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            background: var(--input-bg);
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .checkbox-wrapper input[type="checkbox"]:checked {
            background: var(--primary);
            border-color: var(--primary);
        }

        .checkbox-wrapper input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            color: white;
            font-size: 12px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .forgot-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .forgot-link:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--primary-glow);
            position: relative;
            overflow: hidden;
        }

        .btn-submit::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: all 0.5s;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }

        .btn-submit:hover::after {
            left: 100%;
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .alert-box {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
            display: none;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        /* Dashboard Styles */
        #dashboard-view {
            display: none;
            text-align: center;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            color: var(--success);
            font-size: 40px;
            border: 2px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--surface-border);
            box-shadow: none;
            margin-top: 10px;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--text-muted);
            box-shadow: none;
        }
    </style>
</head>

<body>
    <!-- Background Animation -->
    <div class="ambient-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="auth-wrapper">
        <div class="auth-card" id="auth-card">
            <div class="auth-header">
                <h1>Smart ERP</h1>
                <p>Hệ thống Quản trị Thủy Hải Sản</p>
            </div>

            <div class="tabs">
                <div class="tab-slider" id="tab-slider"></div>
                <button class="tab-btn active" onclick="switchTab('login')">Đăng nhập</button>
                <button class="tab-btn" onclick="switchTab('register')">Đăng ký</button>
            </div>

            <div class="form-container">
                <!-- LOGIN FORM -->
                <div id="login-section" class="form-section active">
                    <div id="login-alert" class="alert-box"></div>
                    <form id="login-form" onsubmit="handleLogin(event)">
                        <div class="input-group">
                            <label for="l-email">Tài khoản / Email</label>
                            <input type="text" id="l-email" placeholder="Nhập admin hoặc email..." required autocomplete="off">
                        </div>
                        <div class="input-group">
                            <label for="l-password">Mật khẩu</label>
                            <input type="password" id="l-password" placeholder="••••••••" required>
                        </div>
                        
                        <div class="options-row">
                            <label class="checkbox-wrapper">
                                <input type="checkbox" id="remember-me">
                                <span>Ghi nhớ đăng nhập</span>
                            </label>
                            <a href="#" class="forgot-link">Quên mật khẩu?</a>
                        </div>

                        <button type="submit" class="btn-submit">Đăng Nhập Ngay</button>
                    </form>
                </div>

                <!-- REGISTER FORM -->
                <div id="register-section" class="form-section">
                    <div id="register-alert" class="alert-box"></div>
                    <form id="register-form" onsubmit="handleRegister(event)">
                        <div class="input-group">
                            <label for="r-fullname">Họ và tên</label>
                            <input type="text" id="r-fullname" placeholder="Vd: Nguyễn Văn A" required>
                        </div>
                        <div class="input-group">
                            <label for="r-email">Email đăng nhập</label>
                            <input type="email" id="r-email" placeholder="name@company.com" required>
                        </div>
                        <div class="grid-2">
                            <div class="input-group">
                                <label for="r-password">Mật khẩu</label>
                                <input type="password" id="r-password" placeholder="Tạo mật khẩu" required minlength="6">
                            </div>
                            <div class="input-group">
                                <label for="r-confirm">Xác nhận</label>
                                <input type="password" id="r-confirm" placeholder="Nhập lại" required minlength="6">
                            </div>
                        </div>
                        
                        <button type="submit" class="btn-submit">Tạo Tài Khoản</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- DASHBOARD VIEW (Shown after login) -->
        <div class="auth-card" id="dashboard-view">
            <div class="form-container" style="padding-top: 50px;">
                <div class="success-icon">✓</div>
                <h2 style="margin-bottom: 15px; font-size: 24px;">Đăng nhập thành công!</h2>
                <p id="welcome-msg" style="color: var(--text-muted); margin-bottom: 30px; line-height: 1.6;">
                    Chào mừng bạn quay trở lại hệ thống Quản trị Smart ERP.
                </p>
                <button class="btn-submit" onclick="goToApp()">Truy cập hệ thống</button>
                <button class="btn-submit btn-outline" onclick="handleLogout()">Đăng xuất</button>
            </div>
        </div>
    </div>

    <script>
        let currentTab = 'login';

        function switchTab(tab) {
            if (tab === currentTab) return;
            
            const loginSec = document.getElementById('login-section');
            const regSec = document.getElementById('register-section');
            const slider = document.getElementById('tab-slider');
            const btns = document.querySelectorAll('.tab-btn');

            // Hide alerts
            document.getElementById('login-alert').style.display = 'none';
            document.getElementById('register-alert').style.display = 'none';

            btns.forEach(b => b.classList.remove('active'));

            if (tab === 'login') {
                slider.style.transform = 'translateX(0)';
                btns[0].classList.add('active');
                
                regSec.classList.remove('active');
                regSec.classList.add('slide-left');
                
                setTimeout(() => {
                    loginSec.classList.remove('slide-left');
                    loginSec.classList.add('active');
                }, 50);
            } else {
                slider.style.transform = 'translateX(calc(100% + 8px))';
                btns[1].classList.add('active');
                
                loginSec.classList.remove('active');
                loginSec.classList.add('slide-left');
                
                setTimeout(() => {
                    regSec.classList.remove('slide-left');
                    regSec.classList.add('active');
                }, 50);
            }
            currentTab = tab;
        }

        function showMessage(type, section, message) {
            const alertBox = document.getElementById(`${section}-alert`);
            alertBox.className = `alert-box alert-${type}`;
            alertBox.innerHTML = message;
            alertBox.style.display = 'block';
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('r-fullname').value.trim();
            const email = document.getElementById('r-email').value.trim();
            const pass = document.getElementById('r-password').value;
            const confirm = document.getElementById('r-confirm').value;

            if (pass !== confirm) {
                showMessage('error', 'register', 'Mật khẩu xác nhận không khớp!');
                return;
            }

            let users = JSON.parse(localStorage.getItem('smart_erp_users') || '{}');
            
            if (users[email] || email === 'admin') {
                showMessage('error', 'register', 'Email này đã được đăng ký!');
                return;
            }

            users[email] = {
                password: pass,
                name: name
            };
            
            localStorage.setItem('smart_erp_users', JSON.stringify(users));
            showMessage('success', 'register', 'Đăng ký thành công! Vui lòng đăng nhập.');
            document.getElementById('register-form').reset();
            
            setTimeout(() => {
                switchTab('login');
                document.getElementById('l-email').value = email;
            }, 1500);
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('l-email').value.trim();
            const pass = document.getElementById('l-password').value;
            
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span style="display:inline-block; animation: spin 1s linear infinite;">↻</span> Đang xử lý...';
            btn.style.opacity = '0.8';

            setTimeout(() => {
                btn.innerHTML = 'Đăng Nhập Ngay';
                btn.style.opacity = '1';

                let isValid = false;
                let userName = email;

                // Hardcoded admin access
                if (email === 'admin' && pass === 'admin') {
                    isValid = true;
                    userName = 'Quản trị viên (Admin)';
                } else {
                    let users = JSON.parse(localStorage.getItem('smart_erp_users') || '{}');
                    if (users[email] && users[email].password === pass) {
                        isValid = true;
                        userName = users[email].name;
                    }
                }

                if (isValid) {
                    document.getElementById('auth-card').style.display = 'none';
                    document.getElementById('dashboard-view').style.display = 'block';
                    document.getElementById('welcome-msg').innerHTML = `Xin chào <strong>${userName}</strong>, bạn đã đăng nhập thành công vào phân hệ Quản trị Thủy Hải Sản.`;
                    document.getElementById('login-form').reset();
                } else {
                    showMessage('error', 'login', 'Tài khoản hoặc mật khẩu không chính xác!');
                }
            }, 800);
        }

        function handleLogout() {
            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('auth-card').style.display = 'block';
            showMessage('success', 'login', 'Đã đăng xuất an toàn.');
        }

        function goToApp() {
            alert('Đang chuyển hướng vào hệ thống ERP...');
            // window.location.href = '/dashboard';
        }

        // Add loading spinner animation to stylesheet dynamically
        const style = document.createElement('style');
        style.innerHTML = `@keyframes spin { 100% { transform: rotate(360deg); } }`;
        document.head.appendChild(style);
    </script>
</body>

</html>
